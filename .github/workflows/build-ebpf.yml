name: Build eBPF branch

on:
  push:
    branches:
      - ebpf-inbound
      - "automation/ebpf-*"
  pull_request:
    branches:
      - ebpf-inbound
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ebpf-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKIP_INTEROP_TEST: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc6-dev linux-libc-dev

      - name: Generate BPF object
        run: make ebpf_generate

      - name: Test eBPF packages
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -count=1 -tags "with_gvisor with_ebpf" ./common/ebpf/... ./listener/sing_ebpf/...

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc6-dev linux-libc-dev

      - name: Generate BPF object
        run: make ebpf_generate

      - name: Check generated object
        run: make ebpf_check

  build:
    needs:
      - test
      - generate-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goamd64: v3
          - goos: linux
            goarch: arm64
          - goos: android
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc6-dev linux-libc-dev

      - name: Install Linux ARM64 cross compiler
        if: ${{ matrix.goos == 'linux' && matrix.goarch == 'arm64' }}
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup NDK
        if: ${{ matrix.goos == 'android' }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Set Android NDK environment
        if: ${{ matrix.goos == 'android' }}
        run: |
          NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}
          echo "CC=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Set Linux environment
        if: ${{ matrix.goos == 'linux' }}
        run: |
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Download dependencies
        run: |
          go mod download

      - name: Apply sing-tun patch (Android)
        if: ${{ matrix.goos == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          SING_TUN_VERSION=$(go list -m github.com/metacubex/sing-tun | awk '{print $2}')
          SING_TUN_DIR="$(go env GOMODCACHE)/github.com/metacubex/sing-tun@${SING_TUN_VERSION}"
          echo "Sing-tun version: ${SING_TUN_VERSION}"
          echo "Sing-tun directory: ${SING_TUN_DIR}"
          chmod -R +w "${SING_TUN_DIR}"
          cd "${SING_TUN_DIR}"
          cp "$GITHUB_WORKSPACE/.github/patch/sing-tun.patch" ./sing-tun.patch
          if grep -q "if len(r.tunOptions.Inet6Address) > 0 && runtime.GOOS == \"android\"" redirect_linux.go 2>/dev/null; then
            echo "Patch already applied (IPv6 Android code found), skipping..."
            exit 0
          fi
          if patch -p1 --reverse --dry-run < sing-tun.patch 2>/dev/null; then
            echo "Patch already applied (reverse dry-run succeeded), skipping..."
            exit 0
          fi
          if patch -p1 --dry-run < sing-tun.patch 2>&1 | grep -q "Reversed (or previously applied) patch detected"; then
            echo "Patch already applied (dry-run detected reversal), skipping..."
            exit 0
          fi
          echo "Applying patch for the first time..."
          patch -p1 < sing-tun.patch

      - name: Generate BPF object
        run: make ebpf_generate

      - name: Record build metadata
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist build
          git fetch --depth=1 https://github.com/MetaCubeX/mihomo.git Alpha
          echo "$(git rev-parse FETCH_HEAD)" > build/UPSTREAM_SHA
          echo "$(git rev-parse HEAD)" > build/COMMIT_SHA
          echo "${GOOS}/${GOARCH}" > build/PLATFORM
          go version > build/GO_VERSION
          version="$(git describe --tags --always --abbrev=12)"
          echo "${version}" > build/VERSION
          echo "version=${version}" >> "$GITHUB_ENV"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        shell: bash
        run: |
          set -euo pipefail
          output="dist/mihomo-ebpf-${GOOS}-${GOARCH}"
          go build -v -tags "with_gvisor with_ebpf" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${version}' \
                      -X 'github.com/metacubex/mihomo/constant.BuildTime=${build_time}' \
                      -w -s -buildid=" \
            -o "${output}" .
          sha256sum "${output}" > "${output}.sha256"
          cp build/* dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mihomo-ebpf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*
            build/*
          if-no-files-found: error

  privileged-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc6-dev linux-libc-dev

      - name: Probe eBPF capabilities
        id: probe
        shell: bash
        run: |
          set +e
          sudo apt-get install -y bpftool >/dev/null 2>&1 || true
          bash common/ebpf/check-kernel.sh --mode local > /tmp/ebpf-probe.log 2>&1
          probe_status=$?
          set -e
          cat /tmp/ebpf-probe.log
          if [ "${probe_status}" -ne 0 ] || grep -Eq '^(FAIL|UNKNOWN) .*\[required' /tmp/ebpf-probe.log; then
            echo "SKIP: runner cannot prove the required eBPF capabilities"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run privileged eBPF integration tests
        if: steps.probe.outputs.skipped == 'false'
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          make ebpf_generate
          sudo -E env SING_BOX_EBPF_INTEGRATION=1 CGO_ENABLED=1 GOCACHE=/tmp/gocache go test -count=1 -tags "with_gvisor with_ebpf ebpf_integration" ./common/ebpf/... -run 'Integration'

      - name: Copy probe log
        run: cp /tmp/ebpf-probe.log ebpf-probe.log

      - uses: actions/upload-artifact@v7
        with:
          name: ebpf-privileged-probe
          path: ebpf-probe.log

  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Build non-eBPF platforms
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags with_gvisor -trimpath -o mihomo-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags with_gvisor -trimpath -o mihomo-darwin-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_gvisor -trimpath -o mihomo-linux-noebpf .
